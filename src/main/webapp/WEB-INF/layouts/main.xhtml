<!DOCTYPE html>
<html lang="#{languageController.locale}">
<f:view xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="primefaces"
        locale="#{languageController.locale}">

    <h:head>
        <meta charset="UTF-8"/>
        <title>#{title}</title>
        <h:outputStylesheet library="webjars" name="primeflex/3.3.1/primeflex.min.css"/>
        <ui:insert name="head"/>
    </h:head>

    <h:body>
        <p:card>
            <h:form>
                <p:menubar>
                    <p:menuitem value="${msg['navbar.text.start']}" outcome="index" icon="pi pi-fw pi-home"/>
                    <p:menuitem value="#{msg['navbar.text.create']}"
                                rendered="#{p:ifGranted('ADMIN')}"
                                onclick="PF('dialogForm').show()" icon="pi pi-fw pi-plus"/>
                    <p:menuitem icon="pi pi-fw pi-flag">
                        <p:selectOneMenu value="#{languageController.language}"
                                         valueChangeListener="#{languageController.select}"
                                         rendered="#{p:ifAnyGranted('ADMIN,USER')}"
                                         onchange="submit()">
                            <f:selectItem itemLabel="#{msg['navbar.text.change.language']}" itemValue="es"/>
                            <f:selectItems value="#{languageController.supportedLanguages}"/>
                        </p:selectOneMenu>
                    </p:menuitem>
                    <p:menuitem value="Login" outcome="login" icon="pi pi-fw pi-sign-in" rendered="#{empty p:userPrincipal()}"/>
                    <p:menuitem value="Logout" action="#{logoutController.logout}" icon="pi pi-fw pi-sign-out" rendered="#{not empty p:userPrincipal()}"/>

                </p:menubar>
            </h:form>

            <div class="p-mb-2">

                <p:messages globalOnly="true" closable="true">
                    <p:autoUpdate />
                </p:messages>
                <h:outputText value="#{msg['welcome.text']} #{p:userPrincipal()} :D !!!"
                              rendered="#{not empty p:userPrincipal()}" />

                <ui:insert name="content"/>
            </div>
            <p:divider/>

            <div class="p-mb-2">
                <footer style="clear: both;">
                    <h:graphicImage value="/resources/img/jakarta.webp" alt="logo jakarta" class="img-rounded"
                                    width="100px"
                                    height="100px"/>
                    <p>
                        <h:outputText value="#{msg['footer.dev.by']}"/>
                    </p>
                    <ui:insert name="js"/>
                </footer>
            </div>
        </p:card>
    </h:body>
</f:view>
</html>
