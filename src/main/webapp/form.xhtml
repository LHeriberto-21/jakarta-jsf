<ui:component xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="primefaces">

            <h:form id="formProduct">

                <div class="field grid">
                    <p:outputLabel value="#{msg['product.name']}" for="name" class="p-col-fixed" style="width:200px;"/>
                    <div class="p-col">
                        <p:inputText id="name" value="#{productController.product.name}"
                                     label="#{msg['product.name']}"/>
                    </div>
                    <div class="p-col">

                        <p:message for="name" style="color:red;"/>
                    </div>

                </div>


                <div class="field grid">
                    <p:outputLabel value="#{msg['product.price']}" for="price" class="p-col-fixed"
                                   style="width:200px;"/>
                    <div class="p-col">
                        <p:inputText id="price" value="#{productController.product.price}"
                                     label="#{msg['product.price']}: " type="number"/>
                    </div>
                    <div class="p-col">

                        <p:message for="price" style="color:red;"/>
                    </div>
                </div>

                <div class="field grid">
                    <p:outputLabel value="#{msg['product.sku']}" for="sku" class="p-col-fixed" style="width:200px;"/>
                    <div class="p-col">
                        <p:inputText id="sku" value="#{productController.product.sku}"
                                     label="#{msg['product.sku']}: "/>
                    </div>
                    <div class="p-col">

                        <p:message for="sku" style="color:red;"/>
                    </div>
                </div>

                <div class="field grid">
                    <p:outputLabel value="#{msg['product.registerDate']}" for="registerDate" class="p-col-fixed"
                                   style="width:200px;"/>
                    <div class="p-col">
                        <p:datePicker pattern="yyyy-MM-dd" id="registerDate" value="#{productController.product.registerDate}"
                                      label="#{msg['product.registerDate']}: "
                                      converterMessage="Indique una fecha valida: (yyyy-MM-dd)">

                            <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                            <f:passThroughAttribute name="type" value="date"/>
                        </p:datePicker>
                    </div>
                    <div class="p-col">
                        <p:message for="registerDate" style="color:red;"/>
                    </div>
                </div>

                <div class="field grid">
                    <p:outputLabel value="#{msg['product.category']}" for="category" class="p-col-fixed"
                                   style="width:200px;"/>
                    <div class="p-col">
                        <p:selectOneMenu id="category" value="#{productController.product.category}">
                            <f:selectItem itemLabel="---- Seleccione una categoría ----" itemValue="#{null}"/>
                            <f:selectItems value="#{categories}" var="cat" itemLabel="#{cat.name}"/>

                            <f:converter binding="#{categoriaConverter}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="p-col">
                        <p:message for="category" style="color:red;"/>
                    </div>
                </div>

                <div class="field grid">
                    <div class="p-col">
                        <p:commandButton
                                value="#{productController.product.id > 0 ? msg['product.button.edit']: msg['product.button.create']}"
                                action="#{productController.save}"

                                class="ui-button-outlined ui-button-sucess" update="@form table"/>
                        <h:inputHidden value="#{productController.product.id}"/>
                    </div>
                </div>
            </h:form>


</ui:component>
