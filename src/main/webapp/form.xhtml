<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="primefaces"
                template="WEB-INF/layouts/main.xhtml">
<!--                xmlns:p="http://primefaces.org/ui"-->

    <ui:define name="content">

        <f:metadata>
            <f:viewParam name="id" value="#{productController.id}"/>
        </f:metadata>

        <p:panel header="#{product.id > 0 ? msg['product.button.edit']: msg['product.button.create']} producto">

            <p:linkButton outcome="index" value="#{msg['product.button.back']}" class="p-my-2"/>

            <h:form>

                <div class="field grid">
                    <p:outputLabel value="#{msg['product.name']}" for="name" class="p-col-fixed" style="width:200px;"/>
                    <div class="p-col">
                        <p:inputText id="name" value="#{product.name}"
                                     label="#{msg['product.name']}"/>
                    </div>
                    <div class="p-col">

                        <p:message for="name" style="color:red;"/>
                    </div>

                </div>


                <div class="field grid">
                    <p:outputLabel value="#{msg['product.price']}" for="price" class="p-col-fixed"
                                   style="width:200px;"/>
                    <div class="p-col">
                        <p:inputText id="price" value="#{product.price}"
                                     label="#{msg['product.price']}: " type="number"/>
                    </div>
                    <div class="p-col">

                        <p:message for="price" style="color:red;"/>
                    </div>
                </div>

                <div class="field grid">
                    <p:outputLabel value="#{msg['product.sku']}" for="sku" class="p-col-fixed" style="width:200px;"/>
                    <div class="p-col">
                        <p:inputText id="sku" value="#{product.sku}"
                                     label="#{msg['product.sku']}: "/>
                    </div>
                    <div class="p-col">

                        <p:message for="sku" style="color:red;"/>
                    </div>
                </div>

                <div class="field grid">
                    <p:outputLabel value="#{msg['product.registerDate']}" for="registerDate" class="p-col-fixed"
                                   style="width:200px;"/>
                    <div class="p-col">
                        <p:datePicker pattern="yyyy-MM-dd" id="registerDate" value="#{product.registerDate}"
                                      label="#{msg['product.registerDate']}: "
                                      converterMessage="Indique una fecha valida: (yyyy-MM-dd)">

                            <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                            <f:passThroughAttribute name="type" value="date"/>
                        </p:datePicker>
                    </div>
                    <div class="p-col">
                        <p:message for="registerDate" style="color:red;"/>
                    </div>
                </div>

                <div class="field grid">
                    <p:outputLabel value="#{msg['product.category']}" for="category" class="p-col-fixed"
                                   style="width:200px;"/>
                    <div class="p-col">
                        <p:selectOneMenu id="category" value="#{product.category}">
                            <f:selectItem itemLabel="---- Seleccione una categoría ----" itemValue="#{null}"/>
                            <f:selectItems value="#{categories}" var="cat" itemLabel="#{cat.name}"/>

                            <f:converter binding="#{categoriaConverter}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="p-col">
                        <p:message for="category" style="color:red;"/>
                    </div>
                </div>

                <div class="field grid">
                    <div class="p-col">
                        <p:commandButton
                                value="#{product.id > 0 ? msg['product.button.edit']: msg['product.button.create']}"
                                action="#{productController.save}"

                                class="ui-button-outlined ui-button-sucess" update="@form"/>
                        <h:inputHidden value="#{product.id}"/>
                    </div>
                </div>
            </h:form>
        </p:panel>
    </ui:define>
</ui:composition>
